name: Daily Tech News

# ---------------------------------------------------------------------------
# Runs the bot once per day, and also lets you trigger it manually for testing.
#
# IMPORTANT: GitHub Actions cron is in UTC.
#   Bangladesh time (BST) = UTC + 6 hours.
#   To deliver at 08:00 BST, schedule 02:00 UTC  ->  "0 2 * * *"
#   Adjust the line below for a different delivery time.
# ---------------------------------------------------------------------------

on:
  schedule:
    - cron: "0 2 * * *"        # 02:00 UTC == 08:00 Bangladesh time
  workflow_dispatch: {}         # manual "Run workflow" button

jobs:
  deliver-news:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run the news bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
          LLM_API_KEY:        ${{ secrets.LLM_API_KEY }}
          # Optional: override the default model without editing code.
          LLM_MODEL:          ${{ secrets.LLM_MODEL }}
        run: python main.py
